[package]
name = "floatlyrics"
version = "1.0.7"
edition = "2021"
license = "GPL-3.0-only"
description = "Floating synced lyrics overlay for any Windows media player"
build = "build.rs"

[[bin]]
name = "FloatLyrics"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
velopack = "=1.3.39-g8d2844f"
rfd = { version = "0.18", default-features = false }
ureq = "2"
paste = "1"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
  "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Com",
  "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_UI_Controls_Dialogs", "Win32_System_ProcessStatus", "Win32_System_Threading",
  "Media_Control", "Foundation", "Foundation_Numerics",
]

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
